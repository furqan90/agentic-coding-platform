services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "443:443"
    environment:
      PROXY_SITES: "${PROXY_SITES:-localhost}"
      PROXY_DEFAULT_SNI: "${PROXY_DEFAULT_SNI:-localhost}"
      ONBOARDING_ADMIN_USER: "${ONBOARDING_ADMIN_USER:-admin}"
      # bcrypt hash (caddy hash-password); single-quote it in .env. The default is the hash of a discarded
      # random password, so the onboarding UI stays locked until one is set ($$ escapes compose's $).
      ONBOARDING_ADMIN_HASH: "${ONBOARDING_ADMIN_HASH:-$$2a$$14$$7xrQnPR.Du64.rQ0f.MhxOzysUGXx8w/FVN6lLqy0umjash2zpKdy}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - litellm
    restart: unless-stopped

  litellm:
    # Pinned (v1.106.6): opencode_trace_attributes.py relies on LiteLLM internals, so re-run
    # the Step 7 checks in docs/proxy-setup.md when changing this.
    image: ghcr.io/berriai/litellm:main-stable@sha256:37e2dafb088a7723beb998590682957386dfc83ffea1848486f8e0e5cfac0b06
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
      - ./opencode_trace_attributes.py:/app/opencode_trace_attributes.py:ro
    environment:
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4317}"
      # 4317 is the collector's gRPC port; without this LiteLLM defaults to OTLP/HTTP and every export fails.
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      # Langfuse project the collector routes these traces to (slug from the observability
      # platform's otel/projects.yaml). Unregistered slugs fall back to its default project.
      OTEL_RESOURCE_ATTRIBUTES: "tl.project=${LANGFUSE_PROJECT:-agentic-coding-platform}"
      DATABASE_URL: "postgresql://litellm:${LITELLM_DB_PASSWORD:-litellm}@postgres:5432/litellm"
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Admin onboarding UI, served by Caddy at /admin/onboarding/ behind basic auth.
  # Reads only the public CA certificate written by scripts/export-ca.ps1, never Caddy's data volume.
  onboarding:
    build: ./onboarding-ui
    environment:
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY}"
      LITELLM_URL: http://litellm:4000
      # URL developers reach the proxy at; written into onboarding files.
      PUBLIC_PROXY_URL: "${PUBLIC_PROXY_URL:-https://localhost}"
      OPENCODE_VERSION: "${OPENCODE_VERSION:-2.0.29}"
    volumes:
      - ./certs:/certs:ro
      - ../onboarding/bootstrap.ps1:/app/bootstrap.ps1:ro
    depends_on:
      - litellm
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: "${LITELLM_DB_PASSWORD:-litellm}"
      POSTGRES_DB: litellm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
