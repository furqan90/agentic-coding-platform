model_list:
  - model_name: qwen3-coder:30b-32k        # the name OpenCode sends in each request
    litellm_params:
      # ollama_chat (/api/chat) passes tools natively; ollama/ (/api/generate) forces JSON output,
      # so every reply becomes a tool call and agent turns never end.
      model: ollama_chat/qwen3-coder:30b-32k
      api_base: http://spark-570a:11434
      num_ctx: 32768                        # force 32K context; Ollama's default is 8K
    model_info:
      max_tokens: 4096
      max_input_tokens: 32768

litellm_settings:
  success_callback: ["otel"]               # emit OTLP spans for every completed call
  callbacks: ["opencode_trace_attributes.handler"]  # name OpenCode traces; path is relative to this file
  max_parallel_requests: 2                 # provisional DGX Spark concurrency cap
  drop_params: true                        # drop OpenAI-only params (e.g. `store`) that Ollama rejects

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Issue per-user virtual keys via: POST /key/generate  Authorization: Bearer <master_key>
  # To switch to a remote deployment, change only api_base above (and baseURL in opencode.json).
